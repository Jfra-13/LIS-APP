name: Deploy Staging

on:
  workflow_dispatch:
  repository_dispatch:
    types: [jenkins-success]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        run: |
          echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/app-lis" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:staging-latest

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-worker:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}-worker:staging-latest

      - name: Deploy to staging host via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            APP_DIR=/opt/app-lis
            if [ ! -d "$APP_DIR" ]; then
              mkdir -p "$APP_DIR"
            fi
            cd "$APP_DIR"

            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            fi

            git fetch --all
            git checkout ${{ github.ref_name }}
            git pull --ff-only origin ${{ github.ref_name }}

            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}

            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker compose -f docker-compose.staging.yml pull web
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -f

