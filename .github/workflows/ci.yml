name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "0 2 * * *"

jobs:
  unit:
    runs-on: ubuntu-latest

    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: app_lis
      DB_USER: app_lis
      DB_PASSWORD: app_lis
      DB_HOST: localhost
      DB_PORT: "5432"
      CELERY_TASK_ALWAYS_EAGER: "1"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: app_lis
          POSTGRES_USER: app_lis
          POSTGRES_PASSWORD: app_lis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_lis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: Lint
        # Non-blocking: style findings are reported but do not fail the build.
        continue-on-error: true
        run: |
          flake8 src/
          black --check src/

      - name: Django checks
        run: |
          python src/manage.py check
          # ManifestStaticFilesStorage requires the manifest to exist, so build
          # it before tests render templates that use {% static %}.
          python src/manage.py collectstatic --noinput
          # Coverage scope and the >=80% gate live in pytest.ini (single source of truth).
          cd src && pytest

  e2e:
    runs-on: ubuntu-latest
    # Non-blocking: heavy end-to-end job (needs RabbitMQ); reported but does not fail the build.
    continue-on-error: true
    if: github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))

    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: app_lis
      DB_USER: app_lis
      DB_PASSWORD: app_lis
      DB_HOST: localhost
      DB_PORT: "5432"
      CELERY_TASK_ALWAYS_EAGER: "0"
      CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: app_lis
          POSTGRES_USER: app_lis
          POSTGRES_PASSWORD: app_lis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_lis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: E2E tests
        run: |
          cd src && pytest tests/e2e/test_triaje_queue.py

