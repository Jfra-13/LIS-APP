{% extends 'core/base.html' %}

{% block title %}Panel de Triaje | LIS{% endblock %}

{% block content %}

<c-page-header title="Panel de Triaje" subtitle="Cola activa — actualización automática cada 10 s">
</c-page-header>

<c-card title="Pacientes en cola">
  <div class="table-responsive">
    <table
      class="table table-hover align-middle mb-0"
      hx-get="{% url 'triage:triage_list' %}"
      hx-trigger="every 10s"
      hx-target="#triage-table-body"
      hx-swap="innerHTML"
    >
      <thead class="table-light">
        <tr>
          <th class="ps-3">Prioridad</th>
          <th>Paciente</th>
          <th class="d-none d-md-table-cell">DNI</th>
          <th class="d-none d-lg-table-cell">Signos Vitales</th>
          <th class="d-none d-md-table-cell">Estado</th>
          <th class="text-end pe-3">Acciones</th>
        </tr>
      </thead>
      <tbody id="triage-table-body">
        {% include 'triage/_triage_rows.html' %}
      </tbody>
    </table>
  </div>
</c-card>

{% if any_critical %}
<audio autoplay>
  <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>
{% endif %}

{% endblock %}
