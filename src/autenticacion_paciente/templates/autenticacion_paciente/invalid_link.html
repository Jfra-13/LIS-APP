{% extends 'core/base.html' %}

{% block title %}Enlace Inválido | Portal del Paciente{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-sm-10 col-md-7 col-lg-6">
    <div class="card text-center">
      <div class="card-body p-5">

        <i class="bi bi-exclamation-octagon fs-1 text-danger d-block mb-3"></i>
        <h2 class="mb-3 text-danger">Enlace inválido o expirado</h2>
        <p class="text-muted mb-4">
          El enlace de acceso que usaste ya no es válido, expiró o ya fue utilizado.
        </p>

        <a href="{% url 'autenticacion_paciente:request_link' %}" class="btn btn-outline-primary">
          Solicitar un nuevo enlace
        </a>

        <div class="mt-3">
          <a href="{% url 'login' %}" class="text-decoration-none small text-muted">Volver al inicio</a>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
