{% extends 'core/base.html' %}

{% block title %}Portal del Paciente - Login{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 2rem auto;">
    <h2 style="text-align: center; margin-top: 0;">Portal del Paciente</h2>
    <p class="muted" style="text-align: center;">Ingrese con su DNI y contraseña</p>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button" style="width: 100%; border: none; cursor: pointer;">Ingresar</button>
    </form>
</div>
{% endblock %}
