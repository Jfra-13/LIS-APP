{% comment %}
  c-card — White rounded card container.

  Attrs:
    title (optional) — renders a card header with this text

  Slot: card body content (default slot)
{% endcomment %}
<div class="card lis-card">
  {% if title %}
    <div class="card-header lis-card__header">
      <h5 class="mb-0">{{ title }}</h5>
    </div>
  {% endif %}
  <div class="card-body">
    {{ slot }}
  </div>
</div>
