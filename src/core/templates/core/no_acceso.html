{% extends 'core/base.html' %}

{% block title %}Sin acceso | LIS{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <div class="mb-4">
      <i class="bi bi-person-x-fill text-muted" style="font-size: 4rem;"></i>
    </div>
    <h2 class="mb-3">Cuenta sin rol asignado</h2>
    <p class="text-muted mb-4">
      Tu cuenta no tiene un rol asignado. Contactá al administrador para que te asigne el acceso correspondiente.
    </p>
    <form action="{% url 'logout' %}" method="post" class="d-inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-secondary">Cerrar sesión</button>
    </form>
  </div>
</div>
{% endblock %}
