{% extends 'core/base.html' %}

{% block title %}Panel del Médico | LIS{% endblock %}

{% block content %}

<c-page-header
  title="Panel del Médico"
  subtitle="Bienvenido, Dr./Dra. {{ request.user.get_full_name|default:request.user.username }}" />

{# KPI tiles #}
<div class="row g-3 mb-4">
  <div class="col-sm-4">
    <c-stat label="Pacientes en espera" value="{{ en_espera }}" icon="bi-hourglass-split" variant="warning" />
  </div>
  <div class="col-sm-4">
    <c-stat label="En consultorio" value="{{ en_consultorio }}" icon="bi-person-check" variant="primary" />
  </div>
  <div class="col-sm-4">
    <c-stat label="Notas escritas hoy" value="{{ notas_hoy }}" icon="bi-file-medical" variant="success" />
  </div>
</div>

{# Quick access #}
<div class="row g-3">
  <div class="col-md-6">
    <c-card title="Acciones">
      <div class="d-flex flex-column gap-2">
        <a href="{% url 'medico:cola_atencion' %}" class="btn btn-primary text-start">
          <i class="bi bi-list-ul me-2"></i>Cola de Atención
          <span class="d-block text-muted small fw-normal">Pacientes en espera — actualización en tiempo real</span>
        </a>
        <a href="{% url 'consulta:nota_list' %}" class="btn btn-outline-secondary text-start">
          <i class="bi bi-file-medical me-2"></i>Notas Médicas
          <span class="d-block text-muted small fw-normal">Historial de consultas y notas clínicas</span>
        </a>
      </div>
    </c-card>
  </div>
</div>

{% endblock %}
