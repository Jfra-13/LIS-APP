{% extends 'core/base.html' %}

{% block title %}Panel de Admisión | LIS{% endblock %}

{% block content %}

<c-page-header
  title="Panel de Admisión"
  subtitle="Bienvenido/a, {{ request.user.get_full_name|default:request.user.username }}" />

{# KPI tiles #}
<div class="row g-3 mb-4">
  <div class="col-sm-4">
    <c-stat label="Registrados hoy" value="{{ pacientes_hoy }}" icon="bi-person-plus" variant="primary" />
  </div>
  <div class="col-sm-4">
    <c-stat label="Pacientes activos" value="{{ total_pacientes }}" icon="bi-people" variant="info" />
  </div>
  <div class="col-sm-4">
    <c-stat label="En cola ahora" value="{{ en_cola }}" icon="bi-list-ul" variant="warning" />
  </div>
</div>

{# Quick access #}
<div class="row g-3">
  <div class="col-md-6">
    <c-card title="Acciones">
      <div class="d-flex flex-column gap-2">
        <a href="{% url 'admision:paciente_create' %}" class="btn btn-primary text-start">
          <i class="bi bi-person-plus me-2"></i>Nuevo Paciente
          <span class="d-block text-muted small fw-normal">Registrar un nuevo paciente en el sistema</span>
        </a>
        <a href="{% url 'admision:paciente_list' %}" class="btn btn-outline-secondary text-start">
          <i class="bi bi-people me-2"></i>Listado de Pacientes
          <span class="d-block text-muted small fw-normal">Buscar y gestionar pacientes registrados</span>
        </a>
      </div>
    </c-card>
  </div>
</div>

{% endblock %}
