{% extends 'core/base.html' %}

{% block title %}Panel de Enfermería | LIS{% endblock %}

{% block content %}

<c-page-header
  title="Panel de Enfermería"
  subtitle="Bienvenido/a, {{ request.user.get_full_name|default:request.user.username }}" />

{# KPI tiles #}
<div class="row g-3 mb-4">
  <div class="col-sm-4">
    <c-stat label="Triajes realizados hoy" value="{{ triajes_hoy }}" icon="bi-heart-pulse" variant="primary" />
  </div>
  <div class="col-sm-4">
    <c-stat label="Pacientes en espera" value="{{ en_espera }}" icon="bi-hourglass-split" variant="warning" />
  </div>
  <div class="col-sm-4">
    <c-stat label="Red flags hoy" value="{{ red_flags_hoy }}" icon="bi-exclamation-triangle" variant="danger" />
  </div>
</div>

{# Quick access #}
<div class="row g-3">
  <div class="col-md-6">
    <c-card title="Acciones">
      <div class="d-flex flex-column gap-2">
        <a href="{% url 'admision:paciente_list' %}" class="btn btn-primary text-start">
          <i class="bi bi-plus-lg me-2"></i>Nuevo Triaje
          <span class="d-block text-muted small fw-normal">Seleccionar paciente para registrar triaje</span>
        </a>
        <a href="{% url 'triage:triage_list' %}" class="btn btn-outline-secondary text-start">
          <i class="bi bi-heart-pulse me-2"></i>Historial de Triajes
          <span class="d-block text-muted small fw-normal">Consultar triajes registrados y clasificaciones Manchester</span>
        </a>
      </div>
    </c-card>
  </div>
</div>

{% endblock %}
