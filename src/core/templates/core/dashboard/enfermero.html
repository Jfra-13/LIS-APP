{% extends 'core/base.html' %}

{% block title %}Panel de Enfermería | LIS{% endblock %}

{% block content %}
<div class="pt-4">
  <h1 class="mb-1"><i class="bi bi-heart-pulse me-2 text-warning"></i>Panel de Enfermería</h1>
  <p class="text-muted mb-4">Bienvenido/a, {{ request.user.get_full_name|default:request.user.username }}.</p>

  <div class="list-group" style="max-width: 480px;">
    <a href="{% url 'triage:triage_list' %}" class="list-group-item list-group-item-action d-flex align-items-center gap-3">
      <i class="bi bi-heart-pulse text-warning fs-5"></i>
      <div>
        <div class="fw-semibold">Triaje</div>
        <small class="text-muted">Registro de signos vitales y clasificación Manchester</small>
      </div>
    </a>
  </div>
</div>
{% endblock %}
