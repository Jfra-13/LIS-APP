{% extends 'core/base.html' %}

{% block title %}Login | MVP0 base{% endblock %}

{% block content %}
  <section class="card">
    <h1>Acceso</h1>
    {% if form.errors %}
      <p class="muted">Usuario o contraseña inválidos.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="button" type="submit">Entrar</button>
    </form>
  </section>
{% endblock %}
