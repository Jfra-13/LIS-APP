
services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: app_lis
      POSTGRES_USER: app_lis
      POSTGRES_PASSWORD: app_lis

  web:
    build: .
    command: bash -c "cd src && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      DEBUG: '1'
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: app_lis
      DB_USER: app_lis
      DB_PASSWORD: app_lis
      DB_HOST: db
      DB_PORT: '5432'
    depends_on:
      - db

volumes:
  postgres_data: